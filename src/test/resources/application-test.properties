# ==========================================
# TEST PROFILE
# ==========================================

spring.application.name=case-viewer

# Use random port for Cucumber/SpringBootTest
server.port=0

# Keep the same context path as the application
server.servlet.context-path=/case-viewer


# ==========================================
# DATABASE - PostgreSQL
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/cases
spring.datasource.username=caseuser
spring.datasource.password=casepassword
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# ==========================================
# JWT
# ==========================================

jwt.secret=your-very-long-secret-key-for-development-only-change-this
jwt.expiration=3600000


# ==========================================
# REDIS
# ==========================================

spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.enable-statistics=true


# ==========================================
# LOGGING
# ==========================================

logging.level.root=INFO
logging.level.com.example.case_viewer=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.transaction=INFO

# Hibernate SQL logging
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
spring.jpa.show-sql=true


# ==========================================
# REDIS
# ==========================================

spring.cache.type=redis

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.username=caseuser
spring.data.redis.password=caseRedisPassword123